<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="320" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D3047" />
      <stop offset="50%" stop-color="#4A4A8A" />
      <stop offset="100%" stop-color="#1E213A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="60" y1="60" x2="260" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F5B851" />
      <stop offset="100%" stop-color="#D99B26" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#FF5B4D" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#86B59F" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2D3047" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo principal -->
  <rect width="320" height="400" rx="28" fill="url(#bgGrad)" />
  <rect width="320" height="400" rx="28" fill="url(#glow)" />

  <!-- Marco interior elegante de invitación -->
  <rect x="22" y="22" width="276" height="356" rx="20" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.55" />
  <rect x="30" y="30" width="260" height="340" rx="16" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 4" />

  <!-- Destellos y confeti decorativo -->
  <circle cx="68" cy="76" r="5" fill="#86B59F" opacity="0.85" />
  <circle cx="254" cy="84" r="6" fill="#FF5B4D" opacity="0.85" />
  <circle cx="74" cy="296" r="4.5" fill="#F5B851" opacity="0.8" />
  <circle cx="248" cy="282" r="5.5" fill="#86B59F" opacity="0.8" />
  <path d="M160 52 L164 64 L176 68 L164 72 L160 84 L156 72 L144 68 L156 64 Z" fill="url(#goldGrad)" />
  <path d="M232 132 L234.5 139.5 L242 142 L234.5 144.5 L232 152 L229.5 144.5 L222 142 L229.5 139.5 Z" fill="#FDE68A" opacity="0.85" />
  <path d="M86 146 L88 152 L94 154 L88 156 L86 162 L84 156 L78 154 L84 152 Z" fill="#FDE68A" opacity="0.75" />

  <!-- Círculo central emblema -->
  <circle cx="160" cy="175" r="58" fill="#FFFFFF" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="160" cy="175" r="46" fill="#FFFFFF" fill-opacity="0.06" />

  <!-- Icono de sobre / tarjeta de invitación con estrella -->
  <rect x="126" y="149" width="68" height="52" rx="8" fill="#FFFFFF" fill-opacity="0.95" />
  <path d="M128 153 L160 179 L192 153" stroke="#4A4A8A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="160" cy="145" r="11" fill="#FF5B4D" />
  <path d="M160 138 L162.2 142.6 L167.2 143.3 L163.6 146.8 L164.5 151.8 L160 149.4 L155.5 151.8 L156.4 146.8 L152.8 143.3 L157.8 142.6 Z" fill="#FFFFFF" />

  <!-- Etiquetas inferiores -->
  <rect x="78" y="258" width="164" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.14" />
  <text x="160" y="276" text-anchor="middle" fill="#FDE68A" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="11" font-weight="800" letter-spacing="2">
    INVITACIÓN VIRTUAL
  </text>

  <text x="160" y="314" text-anchor="middle" fill="#FFFFFF" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="15" font-weight="800" opacity="0.95">
    Recuérdalo
  </text>
  <text x="160" y="334" text-anchor="middle" fill="#CBD5E1" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="10" font-weight="600" opacity="0.8">
    Evento Especial ✨
  </text>
</svg>

