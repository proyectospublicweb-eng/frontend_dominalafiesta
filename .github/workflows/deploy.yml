name: Deploy Frontend to cPanel (recuerdalo.com.mx)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Upload to recuerdalo.com.mx (HTTPS 443)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obtener código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependencias y compilar producción (dist/)
        run: |
          npm ci
          npm run build

      - name: 4. Enviar dist/ a recuerdalo.com.mx por HTTPS (Puerto 443)
        env:
          DEPLOY_TOKEN: ${{ secrets.FTP_PASSWORD }}
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const path = require("path");

          const distDir = path.resolve("dist");
          const files = {};

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
              } else {
                const rel = path.relative(distDir, full).replace(/\\/g, "/");
                files[rel] = fs.readFileSync(full).toString("base64");
              }
            }
          }
          walk(distDir);

          (async () => {
            console.log(`Enviando ${Object.keys(files).length} archivos compilados a https://recuerdalo.com.mx/deploy-hook.php ...`);
            const res = await fetch("https://recuerdalo.com.mx/deploy-hook.php", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Deploy-Token": (process.env.DEPLOY_TOKEN || "").trim(),
              },
              body: JSON.stringify({ target: "frontend", files }),
            });
            const text = await res.text();
            console.log("Respuesta HTTP:", res.status, text);
            if (!res.ok) process.exit(1);
          })();
          EOF
