name: Deploy Frontend to cPanel (recuerdalo.com.mx)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Upload to recuerdalo.com.mx
    runs-on: ubuntu-latest

    steps:
      - name: 1. Obtener código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependencias y compilar producción (dist/)
        run: |
          npm ci
          npm run build

      - name: 4. Subir dist/ a recuerdalo.com.mx vía FTPS
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, ssl, ftplib, pathlib

          host = "34.125.57.24"
          user = os.environ.get("FTP_USER", "").strip()
          passwd = os.environ.get("FTP_PASS", "").strip()

          print(f"Conectando a {host}:21 con usuario '{user}'...")
          ctx = ssl._create_unverified_context()
          ftps = ftplib.FTP_TLS(context=ctx)
          ftps.debugging = 1
          ftps.connect(host, 21, timeout=90)
          print("Saludo 220 recibido. Activando TLS...")
          ftps.auth()
          ftps.login(user, passwd)
          ftps.prot_p()
          print("Autenticación exitosa. Directorio actual:", ftps.pwd())

          dist_dir = pathlib.Path("dist")

          def ensure_remote_dir(remote_dir):
              if not remote_dir or remote_dir == ".":
                  return
              parts = remote_dir.replace("\\", "/").split("/")
              cur = ""
              for p in parts:
                  cur = f"{cur}/{p}" if cur else p
                  try:
                      ftps.mkd(cur)
                  except Exception:
                      pass

          for item in dist_dir.rglob("*"):
              rel = item.relative_to(dist_dir).as_posix()
              if item.is_dir():
                  ensure_remote_dir(rel)
              else:
                  ensure_remote_dir(os.path.dirname(rel))
                  print(f"Subiendo: {rel}")
                  with open(item, "rb") as f:
                      ftps.storbinary(f"STOR {rel}", f)

          ftps.quit()
          print("¡Despliegue completado con éxito!")
          EOF
